[project]
name = "asynccoin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohitbista", email = "114638542+Rohitbista@users.noreply.github.com" }
]
requires-python = ">=3.13"
