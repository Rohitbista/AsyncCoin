[project]
name = "asynccoin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohitbista", email = "114638542+Rohitbista@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
asynccoin = "asynccoin.app.server:main"

[tool.fastapi]
entrypoint = "asynccoin.app.server:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
